name: Build Tenda AC8v5 OpenWrt (Ubuntu 18.04 Container)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Compile OpenWrt 18.06 Firmware

    # MENGATASI MASALAH GCC & GNU MAKE:
    # Menggunakan container Ubuntu 18.04 resmi agar GCC (7.5) & GNU Make (4.1)
    # 100% kompatibel dengan SDK OpenWrt 18.06 milik Tenda AC8v5
    container:
      image: ubuntu:18.04

    steps:
      - name: Install System Prerequisites
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential gcc g++ make ccache git libncurses5-dev \
            zlib1g-dev gawk flex bison gettext unzip bzip2 wget file \
            python python3 rsync sudo libssl-dev tree ca-certificates \
            time bc subversion diffutils patch curl
          apt-get clean

      # MENGATASI MASALAH "fatal: Invalid revision range ...":
      # Wajib fetch-depth: 0 agar OpenWrt bisa membaca histori commit Git
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git Safe Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/openwrt-18.06"

      - name: Update & Install Feeds
        run: |
          cd openwrt-18.06
          if [ -f "scripts/feeds" ]; then
            ./scripts/feeds update -a || true
            ./scripts/feeds install -a || true
          fi

      - name: Prepare Build Configuration (.config)
        run: |
          cd openwrt-18.06
          # Jika belum ada .config khusus, gunakan default config SDK Tenda
          if [ ! -f ".config" ]; then
            make defconfig
          else
            make defconfig
          fi
          # Aktifkan Web UI LuCI
          sed -i 's/^#\(.*src-git luci\)/\1/' feeds.conf.default || true

      - name: Download Dependency Packages
        run: |
          cd openwrt-18.06
          make download -j$(nproc) || make download -j1 V=s

      - name: Compile Firmware
        id: compile
        run: |
          cd openwrt-18.06
          echo "Memulai proses kompilasi..."
          # Jalankan multi-core, jika gagal fallback ke single-core verbose untuk log detail
          make -j$(nproc) || make -j1 V=s

      - name: Prepare Artifacts
        if: always()
        run: |
          cd openwrt-18.06
          mkdir -p ../output_firmware
          # Salin file binary firmware hasil kompilasi
          find bin/targets/ -type f -name "*.*" -exec cp -v {} ../output_firmware/ \; || true
          # Salin file config yang digunakan
          cp -v .config ../output_firmware/build_used.config || true

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tenda-ac8v5-openwrt-firmware
          path: output_firmware/
          retention-days: 14
