name: Build Tenda AC8v5 OpenWrt Siflower (Ubuntu 18.04 Container)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Compile Siflower SF19A28 OpenWrt 18.06

    # SOLUSI 1 (Mengatasi error 'working-make', 'gcc', & 'g++' prerequisite):
    # Siflower 1806_SDK secara resmi membutuhkan lingkungan Ubuntu 18.04 / 16.04.
    # Container Ubuntu 18.04 membawa GCC 7.5 dan GNU Make 4.1 asli yang cocok 100%
    # dengan chipset Siflower SF19A28 / SF19A2890 pada Tenda AC8v5.
    container:
      image: ubuntu:18.04

    steps:
      - name: Install System Prerequisites
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential gcc g++ make ccache git libncurses5-dev \
            zlib1g-dev gawk flex bison gettext unzip bzip2 wget file \
            python python3 rsync sudo libssl-dev tree ca-certificates \
            time bc subversion diffutils patch curl
          apt-get clean

      # SOLUSI 2 (Mengatasi "fatal: Invalid revision range ..."):
      # Wajib fetch-depth: 0 agar git mengunduh riwayat commit lengkap untuk kalkulasi versi OpenWrt
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git Safe Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/openwrt-18.06"

      - name: Update & Install Feeds
        run: |
          cd openwrt-18.06
          if [ -f "scripts/feeds" ]; then
            ./scripts/feeds update -a || true
            ./scripts/feeds install -a || true
          fi

      - name: Prepare Siflower Build Configuration
        run: |
          cd openwrt-18.06
          # Periksa apakah ada konfigurasi target defconfig Siflower SF19A28
          if [ -f "target/linux/siflower/sf19a28_evb_fullmask_def.config" ] && [ ! -f ".config" ]; then
            echo "Memuat defconfig Siflower SF19A28..."
            cp -v target/linux/siflower/sf19a28_evb_fullmask_def.config .config || true
          fi
          make defconfig || true
          # Aktifkan Web UI LuCI
          sed -i 's/^#\(.*src-git luci\)/\1/' feeds.conf.default || true

      - name: Download Dependency Packages
        run: |
          cd openwrt-18.06
          make download -j$(nproc) || make download -j1 V=s

      - name: Compile Siflower Firmware
        id: compile
        run: |
          cd openwrt-18.06
          echo "Memulai proses kompilasi Siflower SF19A28 OpenWrt..."
          # Menggunakan Siflower build script (make.sh)
          if [ -f "./make.sh" ]; then
            chmod +x ./make.sh
            echo "Menjalankan Siflower make.sh ..."
            ./make.sh  || make -j$(nproc) || make -j1 V=s
          else
            echo "make.sh tidak ditemukan, fallback ke standard make defconfig..."
            make defconfig
            make -j$(nproc) || make -j1 V=s
          fi

      - name: Prepare Artifacts
        if: always()
        run: |
          cd openwrt-18.06
          mkdir -p ../output_firmware
          # Kumpulkan binary dari direktori target Siflower maupun direktori root
          find bin/targets/siflower/ -type f \( -name "*.bin" -o -name "*.img" -o -name "*.tar.gz" \) -exec cp -v {} ../output_firmware/ \; || true
          find bin/targets/ -type f \( -name "*.bin" -o -name "*.img" \) -exec cp -v {} ../output_firmware/ \; || true
          find . -maxdepth 2 -type f -name "*siflower*.bin" -exec cp -v {} ../output_firmware/ \; || true
          # Salin file config yang digunakan untuk referensi debugging
          cp -v .config ../output_firmware/siflower_build.config || true

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tenda-ac8v5-siflower-firmware
          path: output_firmware/
          retention-days: 14
