name: Build OpenWrt Tenda AC8 v5

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - release2.0.0
      - fix/tenda-ac8v5-hardware-layout

permissions:
  contents: read

concurrency:
  group: openwrt-build-${{ github.ref }}
  cancel-in-progress: false

env:
  DEBIAN_FRONTEND: noninteractive
  FORCE: "1"
  MAKEFLAGS: "-j2"
  CC: gcc
  CXX: g++

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect OpenWrt SDK root
        id: sdk
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_PATH="$(
            find . \
              -type f \
              -name rules.mk \
              -not -path '*/.git/*' \
              -not -path '*/staging_dir/*' \
              -print -quit \
            | xargs -r dirname
          )"

          if [[ -z "${SDK_PATH}" || ! -f "${SDK_PATH}/rules.mk" ]]; then
            echo "::error::OpenWrt rules.mk not found"
            exit 1
          fi

          SDK_PATH="${SDK_PATH#./}"
          [[ -n "${SDK_PATH}" ]] || SDK_PATH="."
          echo "sdk_dir=${SDK_PATH}" >> "${GITHUB_OUTPUT}"

          if [[ -f .config && "${SDK_PATH}" != "." ]]; then
            cp -f .config "${SDK_PATH}/.config"
          fi

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc \
            g++ \
            gcc-12 \
            g++-12 \
            make \
            binutils \
            libc6-dev \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ca-certificates \
            perl \
            libthread-queue-perl

          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 120
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 120
          sudo update-alternatives --set gcc /usr/bin/gcc-12
          sudo update-alternatives --set g++ /usr/bin/g++-12

          make --version | head -n 1
          gcc --version | head -n 1
          g++ --version | head -n 1

      - name: Diagnose compiler environment
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        shell: bash
        run: |
          set -euxo pipefail

          command -v make
          command -v gcc
          command -v g++

          make --version | head -n 1
          gcc --version | head -n 1
          g++ --version | head -n 1

          printf 'int main(void) { return 0; }\n' | gcc -x c -o /tmp/test-c -
          printf 'int main(void) { return 0; }\n' | g++ -x c++ -o /tmp/test-cpp -
          /tmp/test-c
          /tmp/test-cpp

      - name: Prepare OpenWrt tree
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p dl
          rm -rf tmp staging_dir/host
          rm -rf feeds/*.index feeds/*.tmp feeds/packages.tmp

          if [[ -f feeds.conf.default ]]; then
            cp -f feeds.conf.default feeds.conf
          fi

      - name: Update and install feeds
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Check target configuration
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ -f .config ]] || {
            echo "::error::.config not found"
            exit 1
          }

          grep -q '^CONFIG_TARGET_siflower=y$' .config
          grep -q '^CONFIG_TARGET_siflower_sf19a2890=y$' .config
          grep -q '^CONFIG_TARGET_siflower_sf19a2890_DEVICE_tenda_ac8-v5=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-siflower-wifi=y$' .config

      - name: Build OpenWrt
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        shell: bash
        env:
          FORCE: "1"
        run: |
          set -Eeuo pipefail

          export CC=gcc
          export CXX=g++

          make FORCE=1 prereq V=s
          make FORCE=1 defconfig V=s
          make FORCE=1 download -j2 V=s
          find dl -type f -size -1024c -print -delete || true

          make FORCE=1 -j2 V=s 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"

      - name: Validate firmware artifacts
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t files < <(find bin/targets -type f -size +0c -print)
          [[ "${#files[@]}" -gt 0 ]] || {
            echo "::error::No firmware artifact generated"
            exit 1
          }

          for file in "${files[@]}"; do
            size=$(stat -c '%s' "$file")

            # Tenda AC8 v5 is 8 MiB NOR; firmware region starts at 0x80000.
            # The build payload must fit before the reserved 0x7c0000 region.
            if [[ "$size" -gt $((0x740000)) ]]; then
              echo "::error::$file exceeds AC8 v5 firmware region"
              exit 1
            fi
          done

          echo "Artifacts generated:"
          printf '%s\n' "${files[@]}"

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_Tenda_AC8v5
          path: |
            ${{ steps.sdk.outputs.sdk_dir }}/bin/targets/**
            ${{ steps.sdk.outputs.sdk_dir }}/bin/packages/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
