name: Build Tenda AC8v5 OpenWrt

on:
  push:
    branches: 
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Environment & Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar g++-12 gawk gettext \
            git java-propose-classpath libelf-dev libiconv-hook-dev libncurses5-dev \
            libssl-dev python3 python3-dev python3-setuptools subversion swig time \
            unzip wget xsltproc zlib1g-dev gperf upx-ucl libreadline-dev

      - name: Set GCC Version
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
          gcc --version

      - name: Locate SDK Directory & Setup Config
        run: |
          # Cari folder yang memiliki file Makefile (SDK OpenWrt)
          SDK_DIR=$(find . -maxdepth 2 -name "Makefile" -exec dirname {} \;)
          if [ "$SDK_DIR" = "." ] || [ -z "$SDK_DIR" ]; then
            echo "Menggunakan root direktori"
          else
            echo "Masuk ke folder SDK: $SDK_DIR"
            cd "$SDK_DIR"
          fi

          # Buat file .config dan jalankan defconfig di dalam folder SDK
          cat << 'EOF' > .config
          CONFIG_TARGET_siflower=y
          CONFIG_TARGET_siflower_sf19a28=y
          CONFIG_TARGET_siflower_sf19a28_Tenda_AC8v5=y
          CONFIG_PACKAGE_kmod-ipt-extra=y
          CONFIG_PACKAGE_iptables-mod-extra=y
          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_wireless-tools=y
          EOF
          make defconfig

      - name: Start Compilation
        run: |
          SDK_DIR=$(find . -maxdepth 2 -name "Makefile" -exec dirname {} \;)
          if [ "$SDK_DIR" != "." ] && [ -n "$SDK_DIR" ]; then
            cd "$SDK_DIR"
          fi
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware Result
        uses: actions/upload-artifact@v4
        with:
          name: Tenda-AC8v5-OpenWrt
          path: |
            **/bin/targets/siflower/sf19a28/*
            **/bin/packages/*/*/
