name: Build OpenWrt Tenda AC8 v5

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - release2.0.0

permissions:
  contents: read

concurrency:
  group: openwrt-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  FORCE: "1"
  MAKEFLAGS: "-j2"

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect OpenWrt SDK
        id: sdk
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_PATH="$(find . -type f -name rules.mk -not -path '*/.git/*' -not -path '*/staging_dir/*' -print -quit | xargs -r dirname)"
          if [[ -z "${SDK_PATH}" || ! -f "${SDK_PATH}/rules.mk" ]]; then
            echo "::error::OpenWrt rules.mk tidak ditemukan"
            exit 1
          fi
          SDK_PATH="${SDK_PATH#./}"
          [[ -z "${SDK_PATH}" ]] && SDK_PATH="."
          echo "sdk_dir=${SDK_PATH}" >> "${GITHUB_OUTPUT}"
          if [[ -f .config && "${SDK_PATH}" != "." ]]; then cp -f .config "${SDK_PATH}/.config"; fi

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-12 g++-12 gcc g++ make binutils libc6-dev \
            flex bison gawk gettext git libncurses5-dev libncurses-dev \
            libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev \
            file wget curl ca-certificates perl perl-modules-5.34 \
            libthread-queue-perl
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-12
          sudo update-alternatives --set gcc /usr/bin/gcc-12
          sudo update-alternatives --set g++ /usr/bin/g++-12

      - name: Verify compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          gcc --version
          g++ --version
          printf 'int main(void){return 0;}\n' | gcc -x c -o /tmp/test-c -
          printf 'int main(){return 0;}\n' | g++ -x c++ -o /tmp/test-cpp -
          /tmp/test-c
          /tmp/test-cpp

      - name: Prepare OpenWrt tree
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf tmp staging_dir/host
          rm -rf feeds/packages feeds/luci feeds/routing feeds/telephony
          rm -rf feeds/*.index feeds/*.tmp feeds/packages.tmp
          mkdir -p dl
          if [[ -f feeds.conf.default ]]; then cp -f feeds.conf.default feeds.conf; fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update feeds
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Check target configuration
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q '^CONFIG_TARGET_siflower_sf19a2890_DEVICE_tenda_ac8-v5=y$' .config || {
            echo "::error::Target Tenda AC8 v5 tidak ditemukan di .config"; exit 1;
          }

      - name: Build firmware
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          make prereq FORCE=1 V=s
          make defconfig FORCE=1 V=s
          make download -j2 FORCE=1 V=s
          find dl -type f -size -1024c -print -delete || true
          make -j2 FORCE=1 V=s

      - name: Collect diagnostics on failure
        if: failure()
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        shell: bash
        run: |
          {
            uname -a; free -h; df -h
            gcc --version || true; g++ --version || true
            git status --short || true
            test -f .config && sed -n '1,160p' .config || true
          } | tee failure-diagnostics.txt

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_Tenda_AC8v5
          path: |
            ${{ steps.sdk.outputs.sdk_dir }}/bin/targets/**
            ${{ steps.sdk.outputs.sdk_dir }}/bin/packages/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-build-diagnostics
          path: |
            ${{ steps.sdk.outputs.sdk_dir }}/failure-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 7
