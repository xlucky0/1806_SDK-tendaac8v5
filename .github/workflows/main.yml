name: Build OpenWrt Tenda AC8 v5

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - release2.0.0

permissions:
  contents: read

concurrency:
  group: openwrt-build-${{ github.ref }}
  cancel-in-progress: false

env:
  DEBIAN_FRONTEND: noninteractive
  FORCE: "1"
  MAKEFLAGS: "-j2"
  CC: gcc
  CXX: g++

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-slim
    timeout-minutes: 240

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect OpenWrt SDK
        id: sdk
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_PATH="$(
            find . \
              -type f \
              -name rules.mk \
              -not -path '*/.git/*' \
              -not -path '*/staging_dir/*' \
              -print -quit \
            | xargs -r dirname
          )"

          if [[ -z "${SDK_PATH}" || ! -f "${SDK_PATH}/rules.mk" ]]; then
            echo "::error::OpenWrt rules.mk tidak ditemukan"
            find . -maxdepth 4 -name rules.mk -print || true
            exit 1
          fi

          SDK_PATH="${SDK_PATH#./}"
          [[ -n "${SDK_PATH}" ]] || SDK_PATH="."
          echo "sdk_dir=${SDK_PATH}" >> "${GITHUB_OUTPUT}"
          echo "OpenWrt SDK: ${SDK_PATH}"

          if [[ -f .config && "${SDK_PATH}" != "." ]]; then
            cp -f .config "${SDK_PATH}/.config"
          fi

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-12 g++-12 \
            make \
            binutils \
            libc6-dev \
            flex bison \
            gawk gettext \
            git \
            libncurses5-dev libncurses-dev \
            libssl-dev \
            python3 python3-setuptools \
            rsync unzip zip \
            zlib1g-dev \
            file wget curl ca-certificates \
            perl libthread-queue-perl

          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 120
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 120
          sudo update-alternatives --set gcc /usr/bin/gcc-12
          sudo update-alternatives --set g++ /usr/bin/g++-12
          hash -r

          command -v gcc
          command -v g++
          gcc --version
          g++ --version

      - name: Verify compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'int main(void){return 0;}\n' | gcc -x c -o /tmp/test-c -
          printf 'int main(){return 0;}\n' | g++ -x c++ -o /tmp/test-cpp -
          /tmp/test-c
          /tmp/test-cpp

      - name: Prepare OpenWrt tree
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dl
          rm -rf tmp staging_dir/host
          rm -rf feeds/*.index feeds/*.tmp feeds/packages.tmp
          if [[ -f feeds.conf.default ]]; then
            cp -f feeds.conf.default feeds.conf
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update and install feeds
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Check target configuration
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f .config ]]; then
            echo "::error::.config tidak ditemukan"
            exit 1
          fi

          grep -q '^CONFIG_TARGET_siflower_sf19a2890_DEVICE_tenda_ac8-v5=y$' .config || {
            echo "::error::Target Tenda AC8 v5 tidak ditemukan di .config"
            exit 1
          }

      - name: Build OpenWrt
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          make prereq FORCE=1 V=s
          make defconfig FORCE=1 V=s
          make download -j2 FORCE=1 V=s
          find dl -type f -size -1024c -print -delete || true
          make -j2 FORCE=1 V=s 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"

      - name: Verify firmware output
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          target_files="$(find bin/targets -type f 2>/dev/null | wc -l)"
          [[ "${target_files}" -gt 0 ]] || {
            echo "::error::Firmware tidak dihasilkan."
            exit 1
          }
          find bin/targets -type f -print

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_Tenda_AC8v5
          path: |
            ${{ steps.sdk.outputs.sdk_dir }}/bin/targets/**
            ${{ steps.sdk.outputs.sdk_dir }}/bin/packages/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
