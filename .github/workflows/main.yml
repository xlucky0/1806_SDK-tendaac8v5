name: Build OpenWrt Tenda AC8 v5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Detect SDK Location
        id: setup
        shell: bash
        run: |
          SDK_PATH="$(dirname "$(find . -name rules.mk -not -path '*/.*' -print -quit)")"

          if [ -z "$SDK_PATH" ] || [ ! -f "$SDK_PATH/rules.mk" ]; then
            echo "ERROR: rules.mk not found"
            exit 1
          fi

          echo "SDK found at: $SDK_PATH"
          echo "sdk_dir=$SDK_PATH" >> "$GITHUB_OUTPUT"

          if [ -f .config ] && [ "$SDK_PATH" != "." ]; then
            cp -f .config "$SDK_PATH/.config"
          fi

      - name: Setup Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ make \
            clang flex bison gawk gettext git \
            libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget

      - name: Verify Toolchain
        run: |
          gcc --version
          g++ --version
          make --version

      - name: Update & Install Feeds
        working-directory: ${{ steps.setup.outputs.sdk_dir }}
        shell: bash
        run: |
          [ -e feeds.conf.default ] && cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Download Packages
        working-directory: ${{ steps.setup.outputs.sdk_dir }}
        shell: bash
        run: |
          make defconfig
          make download -j"$(nproc)"
          find dl -size -1024c -delete

      - name: Compile Firmware
        working-directory: ${{ steps.setup.outputs.sdk_dir }}
        shell: bash
        run: |
          echo "Starting compilation..."
          make -j"$(nproc)" V=s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_Tenda_AC8v5
          path: ${{ steps.setup.outputs.sdk_dir }}/bin/targets/
