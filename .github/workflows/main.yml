name: Build Tenda AC8v5 OpenWrt (Docker)

on:
  push:
    branches: 
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
      options: --user root

    steps:
      - name: Prepare Container Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update && apt-get install -y \
            build-essential ccache ecj fastjar g++ gawk gettext \
            git libelf-dev libncurses5-dev libssl-dev python3 python3-dev \
            python3-setuptools subversion swig time unzip wget xsltproc \
            zlib1g-dev gperf upx-ucl libreadline-dev file sudo

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Config and Compile
        run: |
          cd openwrt-18.06
          
          cat << 'EOF' > .config
          CONFIG_TARGET_siflower=y
          CONFIG_TARGET_siflower_sf19a28=y
          CONFIG_TARGET_siflower_sf19a28_Tenda_AC8v5=y
          CONFIG_PACKAGE_kmod-ipt-extra=y
          CONFIG_PACKAGE_iptables-mod-extra=y
          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_wireless-tools=y
          EOF

          make defconfig FORCE=1
          make -j$(nproc) FORCE=1 || make -j1 V=s FORCE=1

      - name: Upload Firmware Result
        uses: actions/upload-artifact@v4
        with:
          name: Tenda-AC8v5-OpenWrt
          path: |
            openwrt-18.06/bin/targets/siflower/sf19a28/*
            openwrt-18.06/bin/packages/*/*/
